<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16191f"/>
      <stop offset="50%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>

    <!-- Neon Accent Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="45%" stop-color="#00dbe9"/>
      <stop offset="100%" stop-color="#d05bff"/>
    </linearGradient>

    <!-- Sigma Symbol Gradient -->
    <linearGradient id="sigmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79ff5b"/>
      <stop offset="40%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00dbe9"/>
    </linearGradient>

    <!-- Radial Core Spotlight -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#00dbe9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#111318" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#39ff14" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Internal Ambient Glow -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#centerGlow)"/>

  <!-- Glowing Outer Border -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="none" stroke="url(#glowGrad)" stroke-width="12" opacity="0.85"/>

  <!-- Inner Soft Inset Border -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Modern Geometric Sigma (Σ) Symbol -->
  <path d="M 152 144 
           L 360 144 
           L 360 196 
           L 248 196 
           L 316 256 
           L 248 316 
           L 360 316 
           L 360 368 
           L 152 368 
           L 256 256 
           Z"
        fill="url(#sigmaGrad)"
        filter="url(#neonShadow)"/>

  <!-- Upper Right AI Neural Node -->
  <circle cx="376" cy="136" r="14" fill="#39ff14" filter="url(#neonShadow)"/>
  <circle cx="376" cy="136" r="6" fill="#ffffff"/>

  <!-- Lower Left Accent Node -->
  <circle cx="136" cy="376" r="10" fill="#00dbe9" opacity="0.9"/>
  <circle cx="136" cy="376" r="4" fill="#ffffff"/>
</svg>
