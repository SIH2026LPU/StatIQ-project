services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: statiq
      POSTGRES_PASSWORD: statiq
      POSTGRES_DB: statiq
    ports:
      # Host 5433 avoids a local Postgres already bound to 5432
      - "5433:5432"
    volumes:
      - statiq_pg:/var/lib/postgresql/data

volumes:
  statiq_pg:
